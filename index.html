<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <script>
      // Açılış denetimi: uygulama BOOT_TIMEOUT_MS içinde açılmazsa (eski tarayıcının
      // tanımadığı kod, yüklenemeyen dosya vb.) uyarı gösterilir ve durum Sentry'ye
      // bildirilir. Bu durumda uygulamanın kendi Sentry bağlantısı hiç çalışmadığı
      // için rapor burada, bağımlılıksız gönderilir. Uygulama açılınca main.tsx
      // uyarı bloğunu kaldırır. Eski tarayıcılarda da çalışsın diye ES5 yazılmıştır.
      // Stil dosyalarından önce durmalı: tarayıcı, inmeyi bekleyen bir stil dosyasının
      // arkasındaki betiği çalıştırmaz; o zaman denetim de hiç başlamazdı.
      (function () {
        var BOOT_TIMEOUT_MS = 15000;
        var SENTRY_DSN = '__SENTRY_DSN__';
        var CANONICAL_HOST = '__CANONICAL_HOST__';
        var SENTRY_TUNNEL_PATH = '__SENTRY_TUNNEL_PATH__';
        var REPORTING_ENABLED = __BOOT_REPORTING_ENABLED__;
        var EVENT_ID_LENGTH = 32;
        var HEX_RADIX = 16;
        var MS_PER_SECOND = 1000;
        var firstError = '';

        window.addEventListener('error', function (event) {
          if (firstError) return;
          var target = event.target || {};
          firstError = event.message || target.src || target.href || 'bilinmeyen hata';
        }, true);

        // Güncel adreste rapor sitenin kendi adresinden gider (sentry.io engelli olabilir)
        function envelopeUrl() {
          if (location.host === CANONICAL_HOST) return SENTRY_TUNNEL_PATH;
          var match = /^https:\/\/([^@]+)@([^/]+)\/(\d+)$/.exec(SENTRY_DSN);
          if (!match) return null;
          return 'https://' + match[2] + '/api/' + match[3] + '/envelope/?sentry_version=7&sentry_key=' + match[1];
        }

        function report() {
          var url = envelopeUrl();
          if (!REPORTING_ENABLED || !url || !window.fetch) return;
          var eventId = '';
          for (var i = 0; i < EVENT_ID_LENGTH; i++) eventId += Math.floor(Math.random() * HEX_RADIX).toString(HEX_RADIX);
          var isStandalone = !!(window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
          var event = {
            event_id: eventId,
            timestamp: Date.now() / MS_PER_SECOND,
            platform: 'javascript',
            level: 'error',
            environment: location.hostname,
            message: 'Uygulama açılamadı (açılış denetimi)',
            tags: { boot_failure: 'true', display_mode: isStandalone ? 'standalone' : 'browser' },
            request: { url: location.origin + location.pathname, headers: { 'User-Agent': navigator.userAgent } },
            extra: {
              first_error: firstError || 'yok',
              ready_state: document.readyState,
              sw_controlled: String(!!(navigator.serviceWorker && navigator.serviceWorker.controller))
            }
          };
          var body = JSON.stringify({ event_id: eventId, sent_at: new Date().toISOString() }) + '\n' +
            JSON.stringify({ type: 'event' }) + '\n' + JSON.stringify(event);
          window.fetch(url, { method: 'POST', body: body, keepalive: true }).catch(function () {});
        }

        window.setTimeout(function () {
          var fallback = document.getElementById('boot-fallback');
          if (!fallback) return;
          fallback.hidden = false;
          document.getElementById('boot-reload').addEventListener('click', function () { location.reload(); });
          report();
        }, BOOT_TIMEOUT_MS);
      })();
    </script>

    <!-- PWA theme -->
    <meta name="theme-color" content="#CA8A04" />
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
    <!-- Yazı tipi ekranı bekletmez: Google Fonts'a ulaşılamazsa sayfa yine çizilir
         (yalnızca sistem yazı tipiyle). media="print" ile indirilir, inince uygulanır. -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" /></noscript>
    <meta name="description" content="Mustafa Akkurt Berberi — Online randevu sistemi" />

    <!-- iOS PWA desteği -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="M. Akkurt" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192x192.png" />

    <title>Mustafa Akkurt Berberi</title>
  </head>
  <body>
<div id="root"></div>

    <!-- Uygulama açılamazsa beyaz ekran yerine gösterilir (bkz. açılış denetimi) -->
    <div id="boot-fallback" hidden class="min-h-screen bg-surface-50 flex flex-col items-center justify-center px-6 text-center">
      <p class="text-gray-900 font-semibold text-lg">Uygulama açılamadı</p>
      <p class="text-gray-500 text-sm mt-2 max-w-xs">
        İnternet bağlantınızı kontrol edip yeniden deneyin. Sorun devam ederse telefonunuzun yazılımını güncelleyin.
      </p>
      <button type="button" id="boot-reload" class="mt-6 bg-gray-900 text-white px-6 py-3 rounded-xl font-semibold text-sm cursor-pointer">
        Yeniden Yükle
      </button>
    </div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
